[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxobranch"
version = "0.1.0"
description = "Auditable taxonomy induction with typed evidence and exact constrained decoding"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = [
    "taxonomy induction",
    "structured prediction",
    "neuro-symbolic",
    "natural language processing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "networkx>=3.0",
]

[project.optional-dependencies]
analysis = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]
neural = [
    "torch>=2.3",
    "transformers>=4.40",
    "peft>=0.11",
    "sentence-transformers>=2.2",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]
ilp = [
    "pulp>=3.0",
    "highspy>=1.7",
]
data = [
    "gdown>=5.2",
    "nltk>=3.8",
]
dev = [
    "pytest>=7.0",
]
full = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "torch>=2.3",
    "transformers>=4.40",
    "peft>=0.11",
    "sentence-transformers>=2.2",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "pulp>=3.0",
    "highspy>=1.7",
    "gdown>=5.2",
    "nltk>=3.8",
]

[project.scripts]
taxobranch-decode = "src.symbolic.maximum_branching:main"

[tool.setuptools.packages.find]
include = ["taxobranch*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
